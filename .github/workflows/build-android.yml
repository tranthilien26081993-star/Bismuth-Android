name: Build Android Mod

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Stub Windows specific cl.cpp for Android
        run: |
          python3 -c "
          import glob
          for path in glob.glob('**/cl.cpp', recursive=True):
              with open(path, 'w') as f:
                  f.write('// Stubbed for Android\n')
              print('Stubbed:', path)
          "

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: build/*.geode
          
